# gitleaks configuration for avito-mcp.
#
# The upstream ruleset stays in force in full. This file records the single
# place where a rule provably fires on something that is not a credential, and
# it narrows that exemption as far as gitleaks allows.
[extend]
useDefault = true

# `test/baselines/legacy-1.3.3-wire.json` pins what the real 1.3.3 server
# answered on the wire. Its `tools/list` step stores one entry per tool:
#
#     "meta_auth_status": "c99c926dfd444f1f6ca9735ba9d5b182"
#
# The value is `sha256(canonical(toolDefinition))` truncated to 32 hex
# characters — see `digest()` in test/support/legacy-wire-bench.ts. Every one of
# those 147 digests is recomputed from this branch's own tool definitions by
# test/legacy-wire-regression.test.ts, so none of them can be a secret: a secret
# is not derivable from the schema. The three that gitleaks reports are the
# tools whose names contain "auth" or "api", which puts a generic-api-key
# keyword next to a high-entropy value.
#
# The exemption below is three conditions ANDed together: the generic-api-key
# rule only, that one file only, and the exact key/value pairs that are known
# false positives. Pinning both halves is intentional: allowing the general
# 32-hex shape would also hide credentials of that shape in the baseline.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Per-tool schema digests in the 1.3.3 wire baseline are hashes, not credentials"
  condition = "AND"
  paths = ['''^test/baselines/legacy-1\.3\.3-wire\.json$''']
  regexTarget = "match"
  regexes = ['''^(meta_auth_status": "c99c926dfd444f1f6ca9735ba9d5b182|msg_discounts_open_api_available": "a0e68506646b8df3bf14f2989a1fa170|msg_discounts_open_api_multi_confirm": "bb9777111674319969c2e3393ee6721f|msg_discounts_open_api_multi_create": "d93d26ff4291e99d4beb6aedc1179c7e|msg_discounts_open_api_stats": "b3dc669aba27fb97f46b3fbf707b0ee9|msg_discounts_open_api_tariff_info": "f47527781be79324e2f4895ecd77df47)"$''']
