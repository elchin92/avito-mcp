version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      vitest:
        dependency-type: 'development'
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # 4.5.x changes generated tool schemas. Keep the public contract stable
      # until a compatibility migration is reviewed; later releases are still checked.
      - dependency-name: 'zod'
        versions: ['4.5.x']
      # @types/node is pinned to the oldest runtime we support (engines.node
      # ">=22.12.0", CI matrix 22.x/24.x). A major bump would type-check code
      # against APIs that do not exist on Node 22 — see commit 623d762, which
      # deliberately downgraded ^25.9.2 -> ^22.20.1. Minor and patch updates
      # inside the 22.x line stay enabled.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'chore(ci)'
